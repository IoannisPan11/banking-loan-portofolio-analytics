[project]
name = "loan-analytics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "GeorgeKorlos", email = "korlosgeorge@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "databricks-sdk>=0.146.0",
    "databricks-sql-connector>=4.6.0",
    "fastapi>=0.142.2",
    "gunicorn>=26.2.0",
    "langchain-core>=1.6.7",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.14",
    "numpy>=2.5.3",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
    "uvicorn-worker>=0.4.0",
]

[project.scripts]
loan-analytics = "loan_analytics:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
data = [
    "databricks-sdk>=0.146.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pyspark>=4.2.0",
]

dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 120
extend-exclude = ["src/loan_analytics/generation"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
